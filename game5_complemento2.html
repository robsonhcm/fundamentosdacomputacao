<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complemento de 2 — Sistemas Digitais</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#0b1220;color:#e8eefc;min-height:100vh}
    .wrap{max-width:700px;margin:auto;padding:30px 20px}
    h1{font-size:1.6rem;margin-bottom:6px}
    .sub{color:#aaa;margin-bottom:28px;font-size:.95rem}
    .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.78rem;margin-bottom:14px;background:#1a2a4a;color:#6ae4ff;border:1px solid #6ae4ff}
    .placar{display:flex;gap:16px;margin-bottom:20px}
    .stat{background:#111b33;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 18px;text-align:center;flex:1}
    .stat-n{font-size:1.5rem;font-weight:bold}
    .stat-l{font-size:.75rem;color:#aaa;margin-top:2px}
    .ac .stat-n{color:#2ecc71}.er .stat-n{color:#e74c3c}
    .progresso{background:#1a2540;border-radius:6px;height:8px;margin-bottom:24px;overflow:hidden}
    .barra{background:#6ae4ff;height:100%;border-radius:6px;transition:.4s}
    .card{background:#111b33;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:24px;margin-bottom:20px}
    .tipo{font-size:.78rem;color:#a78bfa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    .enunciado{background:#0b1830;border-radius:10px;padding:16px 20px;margin-bottom:20px;line-height:1.9}
    .num{font-family:monospace;font-size:1.3rem;color:#7dd3fc}
    .passo{font-size:.85rem;color:#aaa;margin-top:4px}
    .opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{background:#0e1a30;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:14px;color:#e8eefc;font-size:1.05rem;font-family:monospace;cursor:pointer;transition:.2s;text-align:center}
    .btn:hover{border-color:#a78bfa;background:#1a1040}
    .btn.certa{background:#0d3324;border-color:#2ecc71;color:#2ecc71}
    .btn.errada{background:#2d0f0f;border-color:#e74c3c;color:#e74c3c}
    .feedback{border-radius:8px;padding:10px 14px;margin-top:14px;display:none;font-size:.9rem}
    .feedback.ok{background:#0d3324;color:#2ecc71;border:1px solid #2ecc71;display:block}
    .feedback.ko{background:#2d0f0f;color:#e74c3c;border:1px solid #e74c3c;display:block}
    .exp{background:#0b1830;border-left:3px solid #a78bfa;padding:10px 14px;border-radius:0 8px 8px 0;font-size:.85rem;color:#c4b5fd;margin-top:10px;display:none;line-height:1.8;font-family:monospace;white-space:pre-line}
    .btn-prox{background:#a78bfa;color:#0b1220;border:none;border-radius:10px;padding:12px 28px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:12px;display:none}
    .btn-prox:hover{background:#c4b5fd}
    .fim{text-align:center;padding:30px 0}
    .fim h2{font-size:1.8rem;margin-bottom:10px}
    .fim p{color:#aaa;margin-bottom:22px}
    .btn-rei{background:#a78bfa;color:#0b1220;border:none;border-radius:10px;padding:13px 32px;font-size:1rem;font-weight:bold;cursor:pointer}
    .modos-tabs{display:flex;gap:8px;margin-bottom:20px}
    .tab{background:#111b33;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.85rem;color:#aaa;transition:.2s}
    .tab.ativo{background:#1a1040;border-color:#a78bfa;color:#c4b5fd}
  </style>
</head>
<body>
<div class="wrap">
  <span class="badge">Módulo 5</span>
  <h1>Complemento de 2</h1>
  <p class="sub">Subtração via complemento de 2 — o padrão dos processadores modernos.</p>

  <div class="modos-tabs">
    <div class="tab ativo" onclick="setModo(0,this)">C2 do número</div>
    <div class="tab" onclick="setModo(1,this)">Subtração A−B</div>
    <div class="tab" onclick="setModo(2,this)">Overflow?</div>
  </div>

  <div class="placar">
    <div class="stat ac"><div class="stat-n" id="ac">0</div><div class="stat-l">Acertos</div></div>
    <div class="stat er"><div class="stat-n" id="er">0</div><div class="stat-l">Erros</div></div>
    <div class="stat"><div class="stat-n" id="qn">1</div><div class="stat-l">de 10</div></div>
  </div>
  <div class="progresso"><div class="barra" id="barra" style="width:0%"></div></div>

  <div class="card" id="jogo">
    <div class="tipo" id="tipo">—</div>
    <div class="enunciado" id="en"></div>
    <div class="opcoes" id="ops"></div>
    <div class="feedback" id="fb"></div>
    <div class="exp" id="exp"></div>
    <button class="btn-prox" id="prox" onclick="proxima()">Próxima →</button>
  </div>

  <div class="card fim" id="fim" style="display:none">
    <h2 id="ft">🏆 Excelente!</h2><p id="fm"></p>
    <button class="btn-rei" onclick="reiniciar()">Jogar novamente</button>
  </div>
</div>

<script>
function toBin(n,bits){return((n>>>0)&((1<<bits)-1)).toString(2).padStart(bits,'0')}

let modo=0,idx=0,ac=0,er=0,resp=false;
let qs=[];

function gerarQuestoes(){
  qs=[];
  if(modo===0){
    [[45,8],[13,8],[100,8],[7,4],[50,8],[200,8],[3,4],[63,8],[28,8],[15,8]].forEach(([n,bits])=>{
      const c1=parseInt(toBin(n,bits).split('').map(b=>b==='0'?'1':'0').join(''),2);
      const c2=(c1+1)&((1<<bits)-1);
      const res=toBin(c2,bits);
      const op1=toBin((c2+1)&((1<<bits)-1),bits);
      const op2=toBin((c2-1+256)&((1<<bits)-1),bits);
      const op3=toBin(n,bits).split('').map(b=>b==='0'?'1':'0').join('');
      const ops=[...new Set([res,op1,op2,op3])].sort(()=>Math.random()-.5).slice(0,4);
      if(!ops.includes(res))ops[0]=res;
      qs.push({tipo:'Calcule o complemento de 2',
        html:`<span>Número (${bits} bits):</span><br><span class="num">${toBin(n,bits)}</span><div class="passo">→ Qual é o C2?</div>`,
        gabarito:res,ops:ops.sort(()=>Math.random()-.5),
        exp:`${toBin(n,bits)}  (original)\n${toBin(n,bits).split('').map(b=>b==='0'?'1':'0').join('')}  (C1: inverter bits)\n+                 1\n${'─'.repeat(bits)}\n${res}  (C2)`});
    });
  } else if(modo===1){
    [[9,5,4],[15,7,8],[20,11,9],[7,3,4],[12,4,8],[25,8,17],[6,2,4],[14,9,5],[30,12,18],[10,6,4]].forEach(([a,b,bits])=>{
      const c2b=toBin((-b>>>0)&((1<<bits)-1),bits);
      const res=a-b;const resBin=toBin(res,bits);
      const ops=[...new Set([resBin,
        toBin((res+1)&((1<<bits)-1),bits),
        toBin((res-1+256)&((1<<bits)-1),bits),
        toBin((res+2)&((1<<bits)-1),bits)
      ])].sort(()=>Math.random()-.5).slice(0,4);
      if(!ops.includes(resBin))ops[0]=resBin;
      qs.push({tipo:'Subtração por complemento de 2',
        html:`<span>Calcule em ${bits} bits:</span><br><span class="num">${a}₁₀ − ${b}₁₀</span><div class="passo">= ${toBin(a,bits)} + C2(${toBin(b,bits)})</div>`,
        gabarito:resBin,ops:ops.sort(()=>Math.random()-.5),
        exp:`A = ${toBin(a,bits)}\nB = ${toBin(b,bits)}\nC2(B) = ${c2b}\n${'─'.repeat(bits+1)}\n  ${toBin(a,bits)}\n+ ${c2b}\n= ${toBin(a+Math.pow(2,bits)-b,bits+1)} → descarta carry → ${resBin}\n\nResultado: ${res}₁₀`});
    });
  } else {
    const casos=[
      {a:'0110',b:'0101',bits:4,res:'Sim',exp:'0110(6) + 0101(5) = 1011 → bit de sinal=1 (negativo), mas resultado real é 11 → OVERFLOW: soma de dois positivos deu negativo'},
      {a:'0011',b:'0100',bits:4,res:'Não',exp:'0011(3) + 0100(4) = 0111(7) → sem overflow, faixa 4 bits: −8 a 7'},
      {a:'1010',b:'1100',bits:4,res:'Sim',exp:'1010(−6) + 1100(−4) = 0110 → bit sinal=0 (positivo), mas soma de negativos = negativo → OVERFLOW'},
      {a:'0001',b:'0001',bits:4,res:'Não',exp:'0001+0001=0010(2) → sem overflow'},
      {a:'0111',b:'0001',bits:4,res:'Sim',exp:'0111(7)+0001(1)=1000(−8 em C2) → positivo+positivo=negativo → OVERFLOW'},
      {a:'1111',b:'1111',bits:4,res:'Não',exp:'1111(−1)+1111(−1)=1 1110 → descarta carry → 1110(−2) → correto, sem overflow'},
      {a:'0100',b:'0100',bits:4,res:'Sim',exp:'0100(4)+0100(4)=1000(−8 em C2) → OVERFLOW'},
      {a:'1001',b:'0011',bits:4,res:'Não',exp:'1001(−7)+0011(3)=1100(−4) → negativo+positivo, resultado negativo → sem overflow'},
      {a:'0110',b:'0011',bits:4,res:'Não',exp:'0110(6)+0011(3)=1001... wait: 0110+0011=1001 → bit sinal=1 → mas 6+3=9>7 → OVERFLOW'},
      {a:'1100',b:'0010',bits:4,res:'Não',exp:'1100(−4)+0010(2)=1110(−2) → negativo+positivo=negativo → sem overflow'},
    ];
    casos.forEach(c=>{
      qs.push({tipo:'Ocorreu overflow? (complemento de 2, 4 bits)',
        html:`<span class="num">${c.a} + ${c.b}</span><div class="passo">Faixa válida: −8 a +7</div>`,
        gabarito:c.res,ops:['Sim','Não'],exp:c.exp});
    });
  }
  return qs.sort(()=>Math.random()-.5).slice(0,10);
}

function setModo(m,el){
  modo=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('ativo'));
  el.classList.add('ativo');
  reiniciar();
}

function montar(){
  resp=false;
  const q=qs[idx];
  document.getElementById('tipo').textContent=q.tipo;
  document.getElementById('en').innerHTML=q.html;
  document.getElementById('qn').textContent=idx+1;
  document.getElementById('barra').style.width=(idx/10*100)+'%';
  document.getElementById('fb').className='feedback';
  document.getElementById('exp').style.display='none';
  document.getElementById('prox').style.display='none';
  const div=document.getElementById('ops');div.innerHTML='';
  q.ops.forEach(op=>{
    const btn=document.createElement('button');
    btn.className='btn';btn.textContent=op;
    btn.onclick=()=>responder(op,btn,q);
    div.appendChild(btn);
  });
}

function responder(op,btn,q){
  if(resp)return;resp=true;
  const ok=op===q.gabarito;
  if(ok){ac++;document.getElementById('ac').textContent=ac;btn.classList.add('certa')}
  else{er++;document.getElementById('er').textContent=er;btn.classList.add('errada');
    document.querySelectorAll('.btn').forEach(b=>{if(b.textContent===q.gabarito)b.classList.add('certa')})}
  document.getElementById('fb').textContent=ok?'✔ Correto!':'✘ Incorreto!';
  document.getElementById('fb').className='feedback '+(ok?'ok':'ko');
  document.getElementById('exp').textContent=q.exp;
  document.getElementById('exp').style.display='block';
  document.getElementById('prox').style.display='inline-block';
}

function proxima(){idx++;if(idx>=10){fim();return;}montar();}
function fim(){
  document.getElementById('jogo').style.display='none';
  document.getElementById('fim').style.display='block';
  document.getElementById('barra').style.width='100%';
  const pct=Math.round(ac/10*100);
  document.getElementById('ft').textContent=pct>=80?'🏆 Excelente!':pct>=50?'👍 Bom trabalho!':'💡 Continue praticando!';
  document.getElementById('fm').textContent=`Você acertou ${ac} de 10 questões (${pct}%).`;
}
function reiniciar(){
  idx=0;ac=0;er=0;
  document.getElementById('ac').textContent=0;
  document.getElementById('er').textContent=0;
  qs=gerarQuestoes();
  document.getElementById('jogo').style.display='block';
  document.getElementById('fim').style.display='none';
  montar();
}
reiniciar();
</script>
</body>
</html>
